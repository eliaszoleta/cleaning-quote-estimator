<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="5" fill="#2563eb"/>
  <rect x="0" y="625" width="1200" height="5" fill="#2563eb"/>
  <!-- Background subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <!-- Icon badge -->
  <rect x="80" y="120" width="80" height="80" rx="20" fill="#2563eb"/>
  <text x="120" y="176" font-family="system-ui, sans-serif" font-size="44" text-anchor="middle" fill="white">✦</text>
  <!-- Main heading -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white">Clean Estimator</text>
  <!-- Tagline -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#94a3b8">Free Cleaning Cost Calculator for 2026</text>
  <!-- Sub-tagline -->
  <text x="80" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">ZIP-code specific estimates · House, Carpet, Commercial &amp; More</text>
  <!-- CTA pill -->
  <rect x="80" y="440" width="260" height="56" rx="12" fill="#2563eb"/>
  <text x="210" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="white">Get Free Estimate</text>
  <!-- Domain -->
  <text x="1120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" text-anchor="end">cleanestimator.com</text>
</svg>
